name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what this is developed on. 3.11 is the real floor: the pinned
        # pandas, numpy and scikit-learn all declare requires-python >= 3.11,
        # so 3.10 cannot install requirements.txt at all — the README used to
        # claim 3.10 and was wrong.
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Not requirements.txt: that is a pinned freeze of a Windows environment
      # and includes native forensic parsers (pytsk3, libewf-python) that do
      # not build on a clean runner. The suite does not need them — it works on
      # fixtures rather than real disk images, and the extractors that need
      # pytsk3/pyewf import them lazily for exactly this reason.
      # scikit-learn is pinned to the version that produced
      # src/models/forensic_alarm_v2.pkl. A pickled estimator is not guaranteed
      # to load across versions, and test_shipped_model_loads_and_predicts
      # exists to catch exactly that — so CI has to install the version the
      # shipped artifact was built with, or it tests a different question.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy 'scikit-learn==1.8.0' joblib faiss-cpu python-dotenv

      # No API keys here, and none needed: ensure_llm_available() is called at
      # app startup rather than at import, specifically so the package can be
      # imported and tested without credentials.
      #
      # The trained model is committed at src/models/forensic_alarm_v2.pkl, so
      # there is deliberately no training step. Running isolation_model.py here
      # would find no carved images, fall back to the synthetic CSVs, and
      # overwrite the shipped model with the one configuration known to be bad
      # — it flags 37% of a real image. CI should test what ships.
      - name: Run tests
        run: python -m pytest tests/ -q
